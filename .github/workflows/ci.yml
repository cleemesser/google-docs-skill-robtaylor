name: Skill CI

on:
  push:
    branches: [main, python]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Grant permissions needed by the reusable workflow
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync dependencies
        run: uv sync
      - name: Run markdown parser tests
        run: uv run pytest -v

  test-skill:
    needs: pytest
    # Using fork until anthropics/skills#136 is merged
    uses: robtaylor/skills/.github/workflows/skill-ci.yml@add-skill-ci
    with:
      skill_path: "."
      run_api_test: true
      run_claude_code_test: true
    secrets: inherit
