[project]
name = "gsuite"
version = "2.0.0"
description = "CLI for Google Workspace (Docs, Drive, and room for more)"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
  "google-auth-oauthlib>=1.2",
]

[project.scripts]
gsuite = "gsuite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gsuite"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
