[project]
name = "gdocs-skill"
version = "2.0.0"
description = "Claude Code skill for Google Docs and Drive operations"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
  "google-auth-oauthlib>=1.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
